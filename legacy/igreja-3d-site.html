<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Igreja – Mapa 3D</title>
<style>
html,body{margin:0;height:100%;background:#14110f;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eee}
canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar>*{pointer-events:auto}
button{background:#2b2420e6;color:#eee;border:1px solid #5b4b3f;border-radius:10px;padding:8px 12px;font-size:13px}
button:active{background:#4a3b31}
.tip{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;opacity:.85;pointer-events:none;padding:0 12px}
#st{font-size:12px;padding:6px 10px;border-radius:10px;background:#2b2420e6;border:1px solid #5b4b3f}
[hidden]{display:none!important}
#add{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#1d1916f2;border:1px solid #5b4b3f;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;width:min(86vw,320px);z-index:5;font-size:14px}
#add input,#add select{font-size:14px;padding:7px;border-radius:8px;border:1px solid #5b4b3f;background:#2b2420;color:#eee;max-width:100%;box-sizing:border-box}
#add label{display:flex;gap:8px;align-items:center;justify-content:space-between}
#am{font-size:12px;color:#e8c27a;min-height:14px}
#sel{position:fixed;left:0;right:0;top:calc(92px + env(safe-area-inset-top,0px));display:flex;gap:8px;justify-content:center;align-items:center}
#sn{background:#2b2420e6;border:1px solid #5b4b3f;border-radius:10px;padding:8px 12px;font-size:13px}
#lay{display:flex;gap:7px;justify-content:center;flex-basis:100%;order:-1}
#ros{position:fixed;top:calc(30px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px;pointer-events:none}
button.av{width:46px;height:46px;border-radius:50%;padding:0;overflow:hidden;border:2px solid #5b4b3f;background:#1d1916;pointer-events:auto}
button.av.on{border-color:#e8c27a;box-shadow:0 0 8px #e8c27a99}
button.av img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
#meas{position:fixed;pointer-events:none;background:#000c;color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;z-index:6}
#joy{position:fixed;left:18px;bottom:calc(120px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;touch-action:none;z-index:4}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffffaa;pointer-events:none}
button.act{border-color:#e8c27a;background:#4a3b31}
.nu .bar,.nu .tip,.nu #ros,.nu #sel{display:none}
.ro #ba,.ro #br,.ro #rm,.ro #szm,.ro #szp,.ro #fl{display:none}
#imp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#1d1916f2;border:1px solid #5b4b3f;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;width:min(88vw,340px);z-index:5;font-size:14px}
#imp input{font-size:13px;max-width:60%;color:#eee}#imp label{display:flex;gap:8px;align-items:center;justify-content:space-between}#im{font-size:12px;color:#e8c27a;min-height:14px}
#exp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#1d1916f2;border:1px solid #5b4b3f;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;width:min(88vw,340px);z-index:5;font-size:14px}
#exp input,#exp select{font-size:14px;padding:7px;border-radius:8px;border:1px solid #5b4b3f;background:#2b2420;color:#eee;max-width:100%;box-sizing:border-box}
#exp label{display:flex;gap:8px;align-items:center;justify-content:space-between}#xi{font-size:12px;color:#e8c27a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tip" id="tip">Arraste os personagens (setas movem o selecionado) · toque no avatar para focar · arraste o fundo para girar</div>
<div id="ros"></div>
<div id="meas" hidden></div>
<div id="joy" hidden><i></i></div>
<div id="imp" hidden><b>Importar do seu computador</b>
<label>Mapa 3D (.glb) <input id="if" type="file" accept=".glb,.gltf"></label>
<label>Escala <input id="is" type="number" value="1" step="0.1" min="0.01"></label>
<label>Jardim e decoração ao redor <input id="igd" type="checkbox" checked></label>
<button id="ig">Importar como mapa</button>
<label>HDRI (.hdr) <input id="ih" type="file" accept=".hdr"></label>
<div style="display:flex;gap:8px"><button id="ihb">Aplicar HDRI</button><button id="inh">Remover HDRI</button></div>
<div id="im"></div><div style="font-size:11px;opacity:.7">Nomes das peças: floor/piso/chao = chão · wall/parede = colisão · roof/telhado = camada Telhado</div>
<div style="display:flex;justify-content:flex-end"><button id="ix">Fechar</button></div></div>
<div id="exp" hidden><b>Exportar para mesa virtual</b>
<label>Área <select id="xa"></select></label>
<label>Pixels por quadrado <select id="xp"><option>50</option><option selected>70</option><option>100</option><option>140</option></select></label>
<label>Mostrar copas das árvores <input id="xc" type="checkbox"></label>
<label>Sombras <input id="xs" type="checkbox"></label>
<div id="xi"></div>
<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button id="xx">Fechar</button><button id="xpng">Baixar PNG</button><button id="xvtt">Universal VTT</button></div></div>
<div id="sel" hidden><span id="sn"></span><button id="szm">−</button><button id="szp">+</button><button id="fl" title="Espelhar">⇋</button><button id="rm">Remover</button></div>
<div id="add" hidden><b>Novo personagem</b><input id="af" type="file" accept="image/*"><input id="an" placeholder="Nome" maxlength="24">
<label>Tamanho <select id="as"><option value="1.2">Pequeno</option><option value="1.7" selected>Médio</option><option value="2.4">Grande</option><option value="3.4">Enorme</option></select></label>
<label>Cor da base <input id="ac" type="color" value="#8a8f98"></label>
<label>Remover fundo liso <input id="ab" type="checkbox" checked></label><div id="am"></div>
<div style="display:flex;gap:8px;justify-content:flex-end"><button id="ax">Cancelar</button><button id="ao">Adicionar</button></div></div>
<div class="bar"><div id="lay" hidden></div><button id="bwk">Caminhar</button><button id="bpv">3ª pessoa</button><button id="bk">Camadas</button><button id="bn">Anoitecer</button><button id="bv">Vista: Cinema</button><button id="bg">Grade: on</button><button id="bmap">Mapa</button><button id="bim">Importar 3D</button><button id="bx">Exportar VTT</button><button id="bch">Personagens: on</button><button id="ba">+ Personagem</button><button id="br">Resetar</button><button id="bfs" title="Tela cheia">⛶</button><span id="st">local</span></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  MAPS[id]={n:f.name.replace(/\.[^.]+$/,''),build:M=>buildGlb(M,gl.scene,k,dr)};loadMap(id);$('imp').hidden=true;m.textContent=''}
 catch(e){m.textContent='Não consegui abrir esse arquivo (use .glb sem compressão Draco/Meshopt)'}}
async function importHdr(){const f=$('ih').files[0],m=$('im');if(!f){m.textContent='Escolha um arquivo .hdr';return}m.textContent='Carregando…';
 try{if(!THREE.RGBELoader)await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js');
  const tex=await new Promise((ok,no)=>new THREE.RGBELoader().setDataType(THREE.HalfFloatType).load(URL.createObjectURL(f),ok,undefined,no));
  tex.mapping=THREE.EquirectangularReflectionMapping;HDR=tex;dome.material.map=tex;dome.material.needsUpdate=true;dome.scale.x=-1;if(envRT)envRT.dispose();envRT=pmrem.fromEquirectangular(tex);S.environment=envRT.texture;m.textContent='HDRI aplicado'}
 catch(e){m.textContent='Não consegui abrir esse HDRI (use .hdr)'}}
function noHdr(){HDR=null;dome.material.map=skt;dome.material.needsUpdate=true;dome.scale.x=1;updEnv();$('im').textContent='HDRI removido'}
$('bim').onclick=()=>{$('imp').hidden=false};$('ix').onclick=()=>{$('imp').hidden=true};$('ig').onclick=importGlb;$('ihb').onclick=importHdr;$('inh').onclick=noHdr;

// ---------- iniciar ----------
loadMap(CFG.map);DEF.forEach(makeToken);setC(showC);if(Q.get('walk')==='1')setWalk(true);
(async()=>{let ok=false;if(CFG.ws)ok=await netWs(CFG.ws);if(!ok)try{ok=await netDb()}catch(e){}})();
try{if(parent!==window)parent.postMessage({evt:'ready',maps:Object.keys(MAPS)},'*')}catch(e){}

// ---------- loop ----------
(function loop(){requestAnimationFrame(loop);
  const cx=cam.position.x,cz=cam.position.z,hi=!MP.loft||MP.loft.visible;
  for(const k in T){const t=T[k],p=t.g.position,s=t===drag?.45:.25;p.x+=(t.target.x-p.x)*s;p.z+=(t.target.y-p.z)*s;p.y+=(t.ty-p.y)*s;
    t.g.visible=showC&&(hi||t.ty<1.5)&&!(WM.on&&!WM.third&&t===WM.av);const dx=cx-p.x,dz=cz-p.z,el=Math.atan2(cam.position.y-p.y-1,Math.hypot(dx,dz));
    t.sp.rotation.y=Math.atan2(dx,dz);t.sp.rotation.x=-Math.min(1.25,Math.max(0,el-.6)*1.1);t.sp.position.y+=((t===drag?.35:0)-t.sp.position.y)*.3;t.ring.visible=t===sel&&!WM.on}
  if(MP.tick)MP.tick();
  if(anim){ctl.target.lerp(anim.tp,.1);cam.position.lerp(anim.cp,.1);if(cam.position.distanceTo(anim.cp)<.1&&ctl.target.distanceTo(anim.tp)<.1)anim=null}
  if(WM.on)walkStep();else ctl.update();R.render(S,cam)})();
